# Copied to the per-user config directory on first launch.
# Windows: %LOCALAPPDATA%\Ducky\Config\ducky.conf
# Linux: ${XDG_CONFIG_HOME:-~/.config}/ducky/ducky.conf

background-color = #000088
text-color = #ffffff

# Font
font-family = Consolas
font-size = 16
increse-font-size = ctrl++
decrese-font-size = ctrl+-

#change to false to hide
show-navbar = true

# Shell
shell = cmd.exe
#shell-path = C:\Users\deticek\AppData\Local\Programs\nu\bin\nu.exe
#shell-args = -NoLogo -NoProfile
# Example full paths:
# shell-path = C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
# shell = nu.exe
# shell-path = C:\Program Files\Nu\bin\nu.exe
# shell-args = --no-config

# Maximum number of workspaces to preload at startup (1-100)
workspace-max = 20

logtest = Alt+leftControl+Sift+Y
copy = ctrl+C
paste = ctrl+v
# A slash at the start of a fresh input line runs a Ducky command.
terminal-vertical-split = ctrl+t
terminal-horizontal-split = alt+h
terminal-next-split = ctrl+tab
terminal-previous-split = ctrl+sift+tab
terminal-close-split = ctrl+w
terminal-next-workspace = alt++
terminal-previous-workspace = alt+-
# Open a fresh temporary terminal outside workspaces.
temporary-terminal = ctrl+shift+n
# Opens a temporary terminal on startup; saved workspaces remain available.
always-open-in-temporary-terminal = true

workspace-1 = alt+1
workspace-2 = alt+2
workspace-3 = alt+3
workspace-4 = alt+4
workspace-5 = alt+5
workspace-6= alt+6
workspace-7 = alt+7
workspace-8 = alt+8
workspace-9 = alt+9
workspace-10 = alt+0

help-window = F1
help-window-width = 50

ducky-manager = F2

# Timer shortcuts
timer-window = F3
timer-close = ctrl+w
timer-start = ctrl+alt+space
countdown-start = ctrl+alt+c
timer-pause = ctrl+alt+p
timer-reset = ctrl+alt+r

default-countdown-time = 10:00
timer-start-command-enabled = true
timer-countdown-command-enabled = true
timer-pause-command-enabled = true
timer-reset-command-enabled = true
timer-close-command-enabled = true