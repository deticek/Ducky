name: Build and publish Ducky release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v?(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tag must be a semantic version such as v1.0.0."
          }
          "value=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Publish platform packages and Windows installer
        shell: pwsh
        run: .\publish-all.ps1 -Version '${{ steps.version.outputs.value }}' -CompileInstaller

      - name: Upload assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem -LiteralPath .\artifacts\release -File |
            Where-Object {
              $_.Name -match '^Ducky-.*\.(zip|sha256)$' -or
              $_.Name -match '^Ducky\.Bootstrapper-win-x64\.exe(\.sha256)?$' -or
              $_.Name -eq 'Ducky-installer.exe'
            }
          if (-not $assets) {
            throw "No release assets were produced."
          }

          $arguments = @('release', 'upload', $tag) +
            @($assets | ForEach-Object { $_.FullName }) +
            @('--clobber')
          gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Uploading release assets failed."
          }
